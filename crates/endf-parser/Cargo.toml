[package]
name = "endf-parser"
version = "0.1.0"
edition = "2021"
description = "ENDF-6 nuclear data file toolkit"
license = "MIT"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rayon = "=1.8.0"
rayon-core = "=1.12.0"
rustc-hash = "1"
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
