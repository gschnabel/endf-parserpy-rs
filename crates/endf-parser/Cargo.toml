[package]
name = "endf-parser"
version = "0.1.0"
edition = "2021"
description = "ENDF-6 nuclear data file toolkit"
license = "MIT"

[features]
default = ["parallel"]
parallel = ["rayon", "rayon-core"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rayon = { version = "=1.8.0", optional = true }
rayon-core = { version = "=1.12.0", optional = true }
rustc-hash = "1"
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
