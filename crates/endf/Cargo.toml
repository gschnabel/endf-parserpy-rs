[package]
name = "endf"
version = "0.1.0"
edition = "2021"
description = "Recipe-driven parser and writer for ENDF-6 nuclear data files"
license = "MIT"
repository = "https://github.com/gschnabel/endf-parserpy-rs"
homepage = "https://github.com/gschnabel/endf-parserpy-rs"
keywords = ["endf", "nuclear-data", "parser", "fortran", "nuclear-physics"]
categories = ["parser-implementations", "science"]
readme = "README.md"
exclude = ["src/bin/bench_*.rs", "src/bin/profile_*.rs", "src/bin/compile_*.rs"]

[features]
default = ["parallel"]
parallel = ["rayon", "rayon-core"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rayon = { version = "=1.8.0", optional = true }
rayon-core = { version = "=1.12.0", optional = true }
rustc-hash = "1"
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
