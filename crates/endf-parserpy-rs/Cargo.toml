[package]
name = "endf-parserpy-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "endf_parserpy_rs"
crate-type = ["cdylib"]

[dependencies]
endf = { path = "../endf" }
endf-compiled = { path = "../endf-compiled" }
indexmap = "2"
rustc-hash = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }
